name: Deploy garmin to DigitalOcean

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: uv run --extra dev pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          # Docker image name components can't start/end with '_' or '.' or '-'
          repo="$(echo "$repo" | sed -E 's/[._-]+$//; s/^[._-]+//')"
          image="ghcr.io/${repo}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: conf
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST_DEV }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            docker stop garmin || true
            docker rm garmin || true

            set -a && source /root/garmin/.env && set +a
            docker run -d \
              --name garmin \
              --restart unless-stopped \
              -p 127.0.0.1:${PORT}:${PORT} \
              -v garmin-data:/data \
              --env-file /root/garmin/.env \
              --memory 256m \
              --memory-swap 256m \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ needs.build-and-push.outputs.image_tag }}
            docker image prune -f

            for i in $(seq 1 10); do
              if curl -fsS "http://localhost:${PORT}/healthz"; then
                echo "health check passed"
                exit 0
              fi
              echo "waiting for garmin to become healthy... ($i/10)"
              sleep 2
            done
            echo "garmin did not become healthy in time" >&2
            docker logs --tail 100 garmin
            exit 1
