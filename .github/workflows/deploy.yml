name: Deploy to hydra

# Builds the arm64 image on every push to main and publishes it to GHCR.
# The deploy job runs on manual dispatch, or on push once the repo variable
# HYDRA_AUTODEPLOY is "true" — set it at the Railway → hydra cutover, so the
# two hosts never both serve production (see deploy/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hydra
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/velkyvenik/missingmcp

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.HYDRA_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.HYDRA_DEPLOY_KEY }}
        # The key is pinned server-side to deploy.sh (forced command), so the
        # only thing this can do is roll hydra to an image tag.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "hydra.venik.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKtgl4URVjqFAvPaTiufkDkfPCEmYWEzQwvsKS5r+qId" > ~/.ssh/known_hosts
          ssh venik@hydra.venik.org "${{ github.sha }}"
