name: Deploy to hydra

# Builds the arm64 image on every push to main and publishes it to GHCR.
# The deploy job runs on manual dispatch, or on push once the repo variable
# HYDRA_AUTODEPLOY is "true" — set it at the Railway → hydra cutover, so the
# two hosts never both serve production (see deploy/README.md).
on:
  push:
    branches: [main]
    # Every deploy restarts the single-node gateway (a few seconds down) —
    # don't do that for changes that can't affect the image or the host.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hydra
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/velkyvenik/missingmcp

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.HYDRA_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.HYDRA_DEPLOY_KEY }}
        # The key is pinned server-side to deploy.sh (forced command), so the
        # only thing this can do is roll hydra to an image tag.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "hydra.venik.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKtgl4URVjqFAvPaTiufkDkfPCEmYWEzQwvsKS5r+qId" > ~/.ssh/known_hosts
          ssh venik@hydra.venik.org "${{ github.sha }}"

  # Push the outcome to the operator's phone (ntfy). Skipped when nothing was
  # deployed (HYDRA_AUTODEPLOY off) and the build was fine. The topic name
  # works like a password, hence a secret.
  notify:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ntfy
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SHA: ${{ github.sha }}
          # Untrusted text: only ever expanded as a quoted shell variable.
          MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOPIC" ] || { echo "NTFY_TOPIC not set"; exit 0; }
          subject=$(printf '%s' "$MSG" | head -n1 | cut -c1-120)
          if [ "$DEPLOY" = success ]; then
            curl -fsS -o /dev/null -H "Title: Deployed to hydra" -H "Tags: rocket" -H "Priority: low" \
              -H "Click: $RUN" -d "${SHA:0:7} ${subject}" "https://ntfy.sh/$TOPIC"
          else
            what=$([ "$BUILD" = failure ] && echo "build failed, nothing deployed" || echo "deploy failed; deploy.sh rolled back to the previous image if it could")
            curl -fsS -o /dev/null -H "Title: Deploy FAILED" -H "Tags: rotating_light" -H "Priority: high" \
              -H "Click: $RUN" -d "${SHA:0:7} ${subject} — ${what}" "https://ntfy.sh/$TOPIC"
          fi
