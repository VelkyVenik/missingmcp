name: Daily triage

on:
  schedule:
    # 05:45 UTC = 07:45 Europe/Prague in summer (06:45 in winter) — lands just
    # before the gateway's own 08:00 daily user-stats post. Off-peak minute:
    # GitHub cron is best-effort and minute 0 is its most congested slot.
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the triage but do not post to Slack"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      # Subscription-backed analysis (claude setup-token); ANTHROPIC_API_KEY is
      # the optional fallback backend — set either, not both needed.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RAILWAY_SERVICE_ID: 46a897db-2758-4cc0-855b-194a3a9a4164
      RAILWAY_ENVIRONMENT_ID: 622730fa-6d86-40d3-b0bd-6de19bd42728
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: Install Claude Code (subscription analysis backend)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run daily triage
        run: >
          python scripts/daily_triage.py
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
