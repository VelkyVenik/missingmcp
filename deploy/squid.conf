# Garmin sign-in egress proxy on hydra (/etc/squid/squid.conf) — the gateway's
# GARMIN_SSO_PROXY routes: one port per Hetzner Floating IP, so each route
# leaves Garmin's rate limiter a different source address. See deploy/README.md
# → Garmin sign-in egress.
#
# Only the gateway's compose network may use it (and only for *.garmin.com);
# the Hetzner Cloud Firewall keeps the ports off the internet as well. Listening
# on 0.0.0.0 rather than the bridge address: the bridge only exists once docker
# is up, and squid would fail to start before it.
http_port 0.0.0.0:3129
http_port 0.0.0.0:3131

acl gateway src 172.30.0.0/24
acl garmin dstdomain .garmin.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow gateway garmin
http_access deny all

# Port numbers kept from the old proxies on dragon (f2 = 3129, f4 = 3131).
acl via_f2 localport 3129
acl via_f4 localport 3131
tcp_outgoing_address 167.233.184.254 via_f2
tcp_outgoing_address 167.233.183.195 via_f4

# A pure CONNECT relay: nothing to cache, no client address to pass on.
cache deny all
forwarded_for delete
