# systemd drop-in for squid on hydra:
# /etc/systemd/system/squid.service.d/ipv4-only.conf
#
# tcp_outgoing_address only binds IPv4 destinations. connectapi.garmin.com has
# AAAA records, and squid would reach it from hydra's own IPv6 address (the
# "direct" route) instead of the route's Floating IP. Denying IPv6 to the
# service makes squid's happy-eyeballs fall back to IPv4 at once. ::1 stays
# open: squid talks to its own helpers over loopback IPv6.
[Service]
IPAddressDeny=::/0
IPAddressAllow=::1/128
